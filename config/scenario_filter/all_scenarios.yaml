# @package _global_

_target_: nuplan.planning.scenario_builder.scenario_filter.ScenarioFilter

# 限制场景类型以便快速测试
scenario_types:
  - 'starting_left_turn'
  - 'following_lane_with_lead'

# Scenario tokens (empty means all)
scenario_tokens: null

# Log names filter
log_names: null

# Map names filter
map_names: null

# 减少场景数量以便快速测试
num_scenarios_per_type: 2

# 总场景限制
limit_total_scenarios: 5

# Time filtering
timestamp_threshold_s: null
ego_displacement_minimum_m: null

# Additional filters
expand_scenarios: false
remove_invalid_goals: true
shuffle: true

# Speed filtering
ego_start_speed_threshold: null
ego_stop_speed_threshold: null
speed_noise_tolerance: null
