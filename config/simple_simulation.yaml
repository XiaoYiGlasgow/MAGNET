# Simple simulation configuration

defaults:
  - _self_
  - /planner: gnn_transformer_planner
  - /worker: sequential
  - /scenario_builder: nuplan_mini
  - /scenario_filter: all_scenarios
  - /splitter: nuplan
  - /main_callback: serialization_callback

# Override scenario builder paths
scenario_builder:
  data_root: "/mnt/local/Xiao_Yi/nuplan-devkit/nuplan/dataset/nuplan-v1.1/splits/train_pittsburgh"
  map_root: "/mnt/local/Xiao_Yi/nuplan-devkit/nuplan/dataset/maps"

# Limit scenarios for testing
scenario_filter:
  num_scenarios_per_type: 1
  limit_total_scenarios: 2

# Output configuration
output_dir: "simple_test_output"
experiment_name: "gnn_transformer_test"

# Required simulation log path (set to null for running simulation)
simulation_log_main_path: null

# Required seed parameter
seed: 0

# Main callback configuration
main_callback:
  serialization_callback:
    _target_: nuplan.planning.script.callbacks.serialization_callback.SerializationCallback

# Misc
verbose: true
