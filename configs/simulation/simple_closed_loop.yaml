# @package _global_

defaults:
  - /default_simulation
  - /planner: gnn_transformer_planner

# Simulation parameters
number_of_gpus_allocated_per_simulation: 0.0
number_of_cpus_allocated_per_simulation: 1

simulation:
  _target_: nuplan.planning.simulation.main_callback.simulation_main_callback.SimulationMainCallback

  # Simulation setup
  time_controller:
    _target_: nuplan.planning.simulation.controller.step_simulation_time_controller.StepSimulationTimeController
    step_time: 0.1

  # Ego controller
  ego_controller:
    _target_: nuplan.planning.simulation.controller.log_playback.log_playback_controller.LogPlaybackController

  # Observations
  observations:
    _target_: nuplan.planning.simulation.observation.ml_agents.ml_agents_observation.MLAgentsObservation

  # Simulation engines
  simulation_engines:
    - _target_: nuplan.planning.simulation.simulation_engine.simple_log_simulation_engine.SimpleLogSimulationEngine
